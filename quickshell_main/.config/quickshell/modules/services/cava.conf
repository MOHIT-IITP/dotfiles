## CAVA config for Quickshell music visualizer.
# Captures whatever is currently playing (music players AND video/browser audio)
# via the monitor source of the default sink, and streams raw ASCII levels
# on stdout for CavaState.qml to consume.
#
# Do not use this file directly with terminal cava (it prints raw numbers).

[general]
framerate = 60
autosens = 1
sensitivity = 100
bars = 5
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 0

[input]
# 'auto' follows the monitor of the default sink, so music and videos
# are both captured regardless of which app produces them.
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average
reverse = 0

[smoothing]
monstercat = 0
waves = 0
# Lower = faster / more accurate, higher = smoother but laggy.
# 30 tracks beats closely without excessive jitter.
noise_reduction = 30
