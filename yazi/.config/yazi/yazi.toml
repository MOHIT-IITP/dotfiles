# ~/.config/yazi/yazi.toml

[mgr]
# Layout: parent | current | preview
ratio = [1, 4, 3]

# Show hidden files
show_hidden = true

# Show symlink targets
show_symlink = true

# Sort files naturally
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true

# Linemode
linemode = "size"

# Show preview
show_preview = true

# Scroll offset
scrolloff = 5

# Mouse support
mouse_events = ["click", "scroll", "drag", "move"]

# Tab width
tab_width = 2


[preview]
# Preview maximum dimensions
max_width = 1200
max_height = 900

# Image preview
image_filter = "triangle"
image_quality = 90

# Cache previews
cache_dir = "~/.cache/yazi"


[opener]

# Text editor
edit = [
    { run = "$EDITOR %s", block = true, desc = "Edit" }
]

# Open using desktop default application
open = [
    { run = "xdg-open %s1", orphan = true, desc = "Open" }
]

# Open in browser
browser = [
    { run = "xdg-open %s1", orphan = true, desc = "Browser" }
]

# Play video/audio
play = [
    { run = "mpv %s", orphan = true, desc = "Play" }
]

# Open image
image = [
    { run = "xdg-open %s1", orphan = true, desc = "Open Image" }
]

# Open PDF
pdf = [
    { run = "xdg-open %s1", orphan = true, desc = "Open PDF" }
]


[open]

# Text files → editor
prepend_rules = [
    { mime = "text/*", use = "edit" },

    # Programming / config files
    { url = "*.lua", use = "edit" },
    { url = "*.py", use = "edit" },
    { url = "*.js", use = "edit" },
    { url = "*.ts", use = "edit" },
    { url = "*.jsx", use = "edit" },
    { url = "*.tsx", use = "edit" },
    { url = "*.rs", use = "edit" },
    { url = "*.go", use = "edit" },
    { url = "*.c", use = "edit" },
    { url = "*.cpp", use = "edit" },
    { url = "*.h", use = "edit" },
    { url = "*.hpp", use = "edit" },
    { url = "*.java", use = "edit" },
    { url = "*.sh", use = "edit" },
    { url = "*.fish", use = "edit" },
    { url = "*.zsh", use = "edit" },

    # Config/data
    { url = "*.json", use = "edit" },
    { url = "*.toml", use = "edit" },
    { url = "*.yaml", use = "edit" },
    { url = "*.yml", use = "edit" },
    { url = "*.xml", use = "edit" },
    { url = "*.conf", use = "edit" },

    # Browser
    { mime = "text/html", use = "browser" },

    # Media
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },

    # Images
    { mime = "image/*", use = "image" },

    # PDF
    { mime = "application/pdf", use = "pdf" },
]


[tasks]
# Number of simultaneous file operations
file_workers = 4

# Plugin workers
plugin_workers = 4

# Fetch workers
fetch_workers = 4

# Preload workers
preload_workers = 4

# Process workers
process_workers = 4

# Retry failed operations
bizarre_retry = 3

# Memory allocation for images
image_alloc = 536870912

# Maximum preview dimensions
image_bound = [10000, 10000]
